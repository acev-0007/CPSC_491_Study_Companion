name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm environment
        run: |
          echo "CI pipeline started successfully"
          node --version
          npm --version