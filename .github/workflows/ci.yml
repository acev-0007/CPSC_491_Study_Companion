name: CI

on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    outputs:
      build_id: ${{ steps.build_version.outputs.build_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate build ID
        id: build_version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_ID="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

          echo "Generated Build ID: $BUILD_ID"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm environment
        run: |
          echo "CI pipeline started successfully"
          echo "Build ID: $BUILD_ID"
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint


      - name: Run frontend tests
        id: frontend_tests
        working-directory: frontend
        continue-on-error: true
        run: |
          npm test -- --reporter=default --reporter=junit --outputFile.junit=frontend-test-results.xml

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        id: backend_tests
        working-directory: backend
        continue-on-error: true
        run: |
          npm test -- --reporter=default --reporter=junit --outputFile.junit=backend-test-results.xml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TEST_USER1_EMAIL: ${{ secrets.SUPABASE_TEST_USER1_EMAIL }}
          SUPABASE_TEST_USER1_PASSWORD: ${{ secrets.SUPABASE_TEST_USER1_PASSWORD }}
          SUPABASE_TEST_USER2_EMAIL: ${{ secrets.SUPABASE_TEST_USER2_EMAIL }}
          SUPABASE_TEST_USER2_PASSWORD: ${{ secrets.SUPABASE_TEST_USER2_PASSWORD }}

      - name: Validate automated test reports
        if: always()
        id: validate_reports
        run: |
          missing=0

          for report in \
            frontend/frontend-test-results.xml \
            backend/backend-test-results.xml
          do
            if [ ! -s "$report" ]; then
              echo "::error::Missing or empty report: $report"
              missing=1
            else
              echo "Verified report: $report"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Upload automated test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-results
          path: |
            frontend/frontend-test-results.xml
            backend/backend-test-results.xml
          if-no-files-found: error

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-companion-${{ env.BUILD_ID }}
          path: frontend/dist/
          if-no-files-found: error

      - name: Verify automated test results
        if: always()
        env:
          FRONTEND_RESULT: ${{ steps.frontend_tests.outcome }}
          BACKEND_RESULT: ${{ steps.backend_tests.outcome }}
        run: |
          echo "Frontend tests: $FRONTEND_RESULT"
          echo "Backend tests: $BACKEND_RESULT"

          echo "## Automated Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: $FRONTEND_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: $BACKEND_RESULT" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FRONTEND_RESULT" != "success" ] || [ "$BACKEND_RESULT" != "success" ]; then
            echo "One or more automated test suites failed."
            exit 1
          fi

          echo "All automated test suites passed."

      - name: Record successful main build
        if: success() && github.ref == 'refs/heads/main'
        run: |
          echo "Build ID: $BUILD_ID"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"

          echo "## Successful CI Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build ID:** \`$BUILD_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit SHA:** \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
